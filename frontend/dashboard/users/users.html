<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GreenTree | Users</title>

    <link
        rel="stylesheet"
        href="../../css/normalize.css"
    >

    <link
        rel="stylesheet"
        href="users.css"
    >

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="dashboard-header">

        <a
            href="../dashboard.html"
            class="logo"
        >

            <span class="logo-mark">
                G
            </span>

            <span class="logo-text">
                Green<span>Tree</span>
            </span>

        </a>


        <a
            href="../dashboard.html"
            class="back-dashboard"
        >
            Back to Dashboard
        </a>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="users-page">


        <div class="page-header">

            <span class="section-label">
                MANAGEMENT
            </span>


            <h1>
                Users
            </h1>


            <p>
                Manage registered users on your platform.
            </p>

        </div>



        <!-- ================= USERS TABLE ================= -->

        <section class="users-section">

            <div class="users-table-wrapper">

                <table class="users-table">

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Username</th>

                            <th>Email</th>

                            <th>Role</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="usersList">

                        <!-- Users loaded from Go -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>



    <!-- =================================================
         VIEW USER MODAL
    ================================================== -->

    <div
        id="userModal"
        class="modal-overlay"
    >

        <div class="user-modal">


            <button
                id="closeModal"
                class="close-modal"
                type="button"
            >
                ×
            </button>


            <div class="modal-header">

                <div
                    id="modalAvatar"
                    class="modal-avatar"
                >
                    U
                </div>


                <div>

                    <span class="modal-label">
                        USER DETAILS
                    </span>


                    <h2 id="modalName">
                        User
                    </h2>


                    <p id="modalUsername">
                        @username
                    </p>

                </div>

            </div>



            <div class="user-details">


                <div class="detail-item">

                    <span class="detail-label">
                        ID
                    </span>

                    <strong id="modalId">
                        -
                    </strong>

                </div>



                <div class="detail-item">

                    <span class="detail-label">
                        EMAIL
                    </span>

                    <strong id="modalEmail">
                        -
                    </strong>

                </div>



                <div class="detail-item">

                    <span class="detail-label">
                        PHONE
                    </span>

                    <strong id="modalPhone">
                        -
                    </strong>

                </div>



                <div class="detail-item">

                    <span class="detail-label">
                        ROLE
                    </span>

                    <span
                        id="modalRole"
                        class="role-badge"
                    >
                        User
                    </span>

                </div>



                <div class="detail-item">

                    <span class="detail-label">
                        STATUS
                    </span>

                    <span
                        id="modalStatus"
                        class="status-badge"
                    >
                        Active
                    </span>

                </div>



                <div class="detail-item">

                    <span class="detail-label">
                        CREATED AT
                    </span>

                    <strong id="modalCreatedAt">
                        -
                    </strong>

                </div>

            </div>



            <div class="modal-footer">

                <button
                    id="modalCloseButton"
                    class="modal-close-button"
                    type="button"
                >
                    Close
                </button>

            </div>

        </div>

    </div>



    <!-- =================================================
         EDIT USER MODAL
    ================================================== -->

    <div
        id="editModal"
        class="modal-overlay"
    >

        <div class="user-modal edit-modal">


            <button
                id="closeEditModal"
                class="close-modal"
                type="button"
            >
                ×
            </button>


            <div class="modal-title">

                <span class="modal-label">
                    USER MANAGEMENT
                </span>

                <h2>
                    Edit User
                </h2>

                <p>
                    Update the user's information.
                </p>

            </div>



            <!-- ================= FORM ================= -->

            <form id="editUserForm">


                <input
                    type="hidden"
                    id="editUserId"
                >


                <div class="form-group">

                    <label for="editName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="editName"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="editEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="editEmail"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="editPhone">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="editPhone"
                    >

                </div>



                <div class="form-row">


                    <div class="form-group">

                        <label for="editRole">
                            Role
                        </label>

                        <select id="editRole">

                            <option value="User">
                                User
                            </option>

                            <option value="Admin">
                                Admin
                            </option>

                        </select>

                    </div>



                    <div class="form-group">

                        <label for="editStatus">
                            Status
                        </label>

                        <select id="editStatus">

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>



                <div class="edit-message" id="editMessage"></div>



                <div class="edit-actions">

                    <button
                        type="button"
                        id="cancelEdit"
                        class="cancel-button"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        class="save-button"
                    >
                        Save Changes
                    </button>

                </div>


            </form>

        </div>

    </div>



    <script src="users.js"></script>

</body>

</html>
